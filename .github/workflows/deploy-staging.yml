name: Deploy Staging

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_COMPOSE_FILE: docker-compose.staging.yml
      ENV_FILE: /home/ubuntu/kipa_server/.env.staging
      APP_DIR: /home/ubuntu/kipa_server
      AWS_REGION: eu-north-1
      INSTANCE_ID: i-0f58b63c037f6f4ae

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Deploy using SSM RunCommand
      - name: Deploy via SSM
        run: |
          echo "Deploying Kipa server via SSM..."
          aws ssm send-command \
            --targets Key=InstanceIds,Values=${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Kipa staging" \
            --parameters '{"commands":["cd /home/ubuntu/kipa_server","git fetch --all","git reset --hard origin/main","docker compose -f docker-compose.staging.yml --env-file /home/ubuntu/kipa_server/.env.staging up -d --build","docker image prune -f"]}' \
            --region ${{ env.AWS_REGION }}