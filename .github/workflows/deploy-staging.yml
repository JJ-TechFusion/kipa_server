name: Deploy Staging

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_COMPOSE_FILE: docker-compose.staging.yml
      ENV_FILE: /home/ubuntu/kipa_server/.env.staging
      APP_DIR: /home/ubuntu/kipa_server
      AWS_REGION: eu-north-1
      INSTANCE_ID: i-0f58b63c037f6f4ae

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Deploy using SSM RunCommand
      - name: Deploy via SSM
        run: |
          echo "Deploying Kipa server via SSM..."

          # Send command and capture command ID
          COMMAND_ID=$(aws ssm send-command \
            --targets Key=InstanceIds,Values=${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Kipa staging" \
            --parameters '{"commands":["cd /home/ubuntu/kipa_server","git fetch --all","git reset --hard origin/main","docker compose -f docker-compose.staging.yml --env-file /home/ubuntu/kipa_server/.env.staging up -d --build","docker image prune -f"]}' \
            --region ${{ env.AWS_REGION }} \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Waiting for command to complete..."

          # Wait for command to complete (timeout 5 minutes)
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ env.INSTANCE_ID }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: Status = $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              # Show output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ env.INSTANCE_ID }} \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              # Show error output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ env.INSTANCE_ID }} \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out waiting for SSM command"
          exit 1