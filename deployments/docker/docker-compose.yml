services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: kipa-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_DBNAME:-kipa}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_DBNAME:-kipa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: kipa-redis
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Run migrations
  migrate:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    container_name: kipa-migrate
    command: ["/app/migrate", "-command", "up", "-path", "/app/migrations"]
    env_file:
      - ../../.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-kipa}
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Kipa API
  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    container_name: kipa-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ../../.env
    environment:
      # Docker-specific overrides (different from .env file)
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # All other variables loaded from .env file via env_file directive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: kipa-network
