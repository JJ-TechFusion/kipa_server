services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: kipa-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_DBNAME:-kipa}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_DBNAME:-kipa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: kipa-redis
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Run migrations
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kipa-migrate
    command: ["/app/migrate", "-command", "up", "-path", "/app/migrations"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-kipa}
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Kipa API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kipa-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Server
      SERVER_PORT: 8080
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT:-development}

      # Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-kipa}
      DATABASE_SSLMODE: disable

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # JWT
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      # Termii
      TERMII_API_KEY: ${TERMII_API_KEY}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-Kipa}

      # Paystack
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}

      # Google Maps
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}

      # Worker Configuration
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_ESCROW_CHECK_INTERVAL: ${WORKER_ESCROW_CHECK_INTERVAL:-1m}
      WORKER_RIDER_SEARCH_CHECK_INTERVAL: ${WORKER_RIDER_SEARCH_CHECK_INTERVAL:-30s}
      WORKER_LINK_EXPIRY_CHECK_INTERVAL: ${WORKER_LINK_EXPIRY_CHECK_INTERVAL:-5m}
      WORKER_RADIUS_EXPAND_INTERVAL: ${WORKER_RADIUS_EXPAND_INTERVAL:-2m}
      WORKER_RIDER_SEARCH_TIMEOUT_MINS: ${WORKER_RIDER_SEARCH_TIMEOUT_MINS:-15}
      WORKER_RADIUS_EXPAND_INTERVAL_MINS: ${WORKER_RADIUS_EXPAND_INTERVAL_MINS:-3}

      # AWS S3 Configuration
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BASE_URL: ${AWS_S3_BASE_URL}
      AWS_MAX_FILE_SIZE_MB: ${AWS_MAX_FILE_SIZE_MB:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: kipa-network
